name: Build APK & Play Store AAB

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Install Android SDK 36.1 & Gradle 9.3.1
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "platforms;android-36.1" "build-tools;36.0.0" || true

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Generate Keystore for Signing (Debug & Release Upload Key)
        run: |
          if [ ! -f debug.keystore ] && [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          fi
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          if [ ! -f my-upload-key.jks ]; then
            keytool -genkeypair -v -keystore my-upload-key.jks -storepass garbhagriha123 -alias upload -keypass garbhagriha123 -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Garbhagriha,OU=Game,O=Studio,L=India,S=IN,C=IN"
          fi

      - name: Ensure .env exists
        run: |
          if [ ! -f .env ] && [ -f .env.example ]; then
            cp .env.example .env
          fi

      - name: Upload Pre-Built APK & AAB Immediately (Fast Track)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Garbhagriha-Ready-To-Install-Files
          path: |
            DOWNLOAD_GAME_HERE/*.apk
            DOWNLOAD_GAME_HERE/*.aab
            DOWNLOAD_GAME_HERE/*.jks

      - name: Build Fresh Debug & Release APK + Play Store Bundle (AAB)
        continue-on-error: true
        env:
          STORE_PASSWORD: garbhagriha123
          KEY_PASSWORD: garbhagriha123
        run: gradle assembleDebug assembleRelease bundleRelease --no-configuration-cache

      - name: Upload Freshly Built Mobile APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Garbhagriha-Mobile-APK
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/app-release.apk
            DOWNLOAD_GAME_HERE/Garbhagriha-3D-Latest.apk
            DOWNLOAD_GAME_HERE/Garbhagriha-Game.apk

      - name: Upload Freshly Built Play Store Bundle (AAB + Keystore)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Garbhagriha-PlayStore-AAB
          path: |
            app/build/outputs/bundle/release/app-release.aab
            my-upload-key.jks
            DOWNLOAD_GAME_HERE/Garbhagriha-PlayStore.aab
