name: Build APK & Play Store AAB

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Generate Keystore for Signing (Debug & Release Upload Key)
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          if [ ! -f my-upload-key.jks ]; then
            keytool -genkeypair -v -keystore my-upload-key.jks -storepass garbhagriha123 -alias upload -keypass garbhagriha123 -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Garbhagriha,OU=Game,O=Studio,L=India,S=IN,C=IN"
          fi

      - name: Ensure .env exists
        run: |
          if [ ! -f .env ] && [ -f .env.example ]; then
            cp .env.example .env
          fi

      - name: Build Debug APK (For Mobile Installation)
        env:
          STORE_PASSWORD: garbhagriha123
          KEY_PASSWORD: garbhagriha123
        run: gradle assembleDebug

      - name: Build Signed Release APK & Play Store Bundle (AAB)
        env:
          STORE_PASSWORD: garbhagriha123
          KEY_PASSWORD: garbhagriha123
        run: gradle assembleRelease bundleRelease

      - name: Upload Mobile APK (Install on Phone)
        uses: actions/upload-artifact@v4
        with:
          name: Garbhagriha-Mobile-APK
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/app-release.apk

      - name: Upload Play Store Bundle (AAB + Keystore)
        uses: actions/upload-artifact@v4
        with:
          name: Garbhagriha-PlayStore-AAB
          path: |
            app/build/outputs/bundle/release/app-release.aab
            my-upload-key.jks
