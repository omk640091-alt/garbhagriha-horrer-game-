name: Build APK & Play Store AAB

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Install Android SDK 36.1 & Gradle 9.3.1
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "platforms;android-36.1" "build-tools;36.0.0" || true

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Generate Keystore for Signing (Debug & Release Upload Key)
        run: |
          if [ ! -f debug.keystore ] && [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          fi
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          if [ ! -f my-upload-key.jks ]; then
            keytool -genkeypair -v -keystore my-upload-key.jks -storepass garbhagriha123 -alias upload -keypass garbhagriha123 -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Garbhagriha,OU=Game,O=Studio,L=India,S=IN,C=IN"
          fi

      - name: Ensure .env exists
        run: |
          if [ ! -f .env ] && [ -f .env.example ]; then
            cp .env.example .env
          fi

      - name: Build Debug & Release APK + Play Store Bundle (AAB)
        env:
          STORE_PASSWORD: garbhagriha123
          KEY_PASSWORD: garbhagriha123
        run: |
          gradle assembleDebug assembleRelease bundleRelease --no-configuration-cache
          cp app/build/outputs/apk/debug/app-debug.apk Garbhagriha-3D-Mobile.apk
          cp app/build/outputs/apk/release/app-release.apk Garbhagriha-3D-Release.apk
          cp app/build/outputs/bundle/release/app-release.aab Garbhagriha-PlayStore.aab

      - name: Upload Mobile APK Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Garbhagriha-Mobile-APK
          path: |
            Garbhagriha-3D-Mobile.apk
            Garbhagriha-3D-Release.apk

      - name: Upload Play Store Bundle (AAB + Keystore)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Garbhagriha-PlayStore-AAB
          path: |
            Garbhagriha-PlayStore.aab
            my-upload-key.jks

      - name: Publish Direct Download Release on GitHub
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "🪔 Garbhagriha 3D Game APK (Build #${{ github.run_number }})"
          body: |
            ### 📱 मोबाइल में सीधे इंस्टॉल करने के लिए नीचे `Garbhagriha-3D-Mobile.apk` पर टैप करें!
            - **Mobile APK:** `Garbhagriha-3D-Mobile.apk` (सीधे फोन में इंस्टॉल करें)
            - **Play Store Bundle:** `Garbhagriha-PlayStore.aab` (Google Play Console के लिए)
          files: |
            Garbhagriha-3D-Mobile.apk
            Garbhagriha-3D-Release.apk
            Garbhagriha-PlayStore.aab
            my-upload-key.jks
